name: Benchmark

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache models and corpora
        uses: actions/cache@v4
        with:
          path: |
            ~/.EasyOCR
            ~/.cache/huggingface
            ~/nltk_data
          key: models-${{ runner.os }}-v1

      - name: Download WordNet
        run: python -m nltk.downloader wordnet

      - name: Run benchmark suite
        run: |
          mkdir -p bench-results
          python main.py benchmark --game all --repeats 50 \
            --json-out bench-results/benchmark.json \
            --markdown-out bench-results/benchmark.md

      - name: Publish job summary
        if: always()
        run: |
          echo "## Daily benchmark — $(date -u +%F)" >> "$GITHUB_STEP_SUMMARY"
          cat bench-results/benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.run_id }}
          path: bench-results/
