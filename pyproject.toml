[project]
name = "linkedin-puzzle-solvers"
version = "1.0.0"
description = "Computer-vision parsers and algorithmic solvers for LinkedIn's daily puzzles"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # pairwise zip(x, x[1:]) is intentionally unequal-length
