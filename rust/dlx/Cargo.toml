[package]
name = "dlx_rs"
version = "0.1.0"
edition = "2021"
description = "Knuth's Algorithm X on Dancing Links, as a Python extension (PyO3)"
license = "MIT"
publish = false

[lib]
name = "dlx_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }

[profile.release]
lto = true
codegen-units = 1
