repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']  # Blocks accidentally committing massive files
      - id: check-case-conflict
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      # Runs Ruff linter and automatically fixes safe errors (imports, unused variables, etc.)
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Runs Ruff code formatter (replacing manual formatting/isort)
      - id: ruff-format
